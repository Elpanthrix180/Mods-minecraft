name: Compilar mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Subir JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: panthrixs-robots-jar
          path: build/libs/*.jar

      - name: Publicar JAR en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panthrixs-robots-${{ github.ref_name }}
          name: Panthrix's Robots (${{ github.ref_name }})
          prerelease: true
          make_latest: true
          files: build/libs/*.jar
          body: |
            JAR compilado automáticamente desde la rama `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Para Minecraft Java 1.20.1 + Forge 47.x. Cópialo en la carpeta `mods`.
